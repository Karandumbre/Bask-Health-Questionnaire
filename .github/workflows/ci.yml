name: CI Quality Gate & Build Verification

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  validate:
    name: Lint, Types & Unit Tests
    runs-on: ubuntu-latest
    permissions:
      contents: read
    env:
      DATABASE_URL: ${{ secrets.TEST_DATABASE_URL }}

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Setup Node.js 22
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: "npm"

      - name: Install dependencies
        run: npm ci

      - name: ESLint verification
        run: npm run lint

      - name: TypeScript strict verification
        run: npx tsc --noEmit

      - name: Run Vitest unit & domain benchmark suite
        run: npm run test:unit

      - name: Run PostgreSQL integration tests (when disposable test DB secrets provided)
        if: env.DATABASE_URL != ''
        run: npm run test:integration
        env:
          DATABASE_URL: ${{ secrets.TEST_DATABASE_URL }}
          DATABASE_DIRECT_URL: ${{ secrets.TEST_DATABASE_DIRECT_URL }}
          IS_TEST_DATABASE: "true"
          APP_SESSION_PEPPER: ${{ secrets.APP_SESSION_PEPPER }}
          NEXT_PUBLIC_SUPABASE_URL: ${{ secrets.NEXT_PUBLIC_SUPABASE_URL }}

      - name: Verify build artifact
        run: npm run build
        env:
          DATABASE_URL: "postgres://build:build@localhost:5432/build"
          NEXT_PUBLIC_SUPABASE_URL: "https://example.supabase.co"
          APP_SESSION_PEPPER: "placeholder-32-byte-secret-for-ci-build"
