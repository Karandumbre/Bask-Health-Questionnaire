name: Controlled Database Migration
run-name: Database Migration (${{ github.event.inputs.environment || 'development' }}) triggered by ${{ github.actor }}

on:
  workflow_dispatch:
    inputs:
      environment:
        description: "Target database environment (preview | production)"
        required: true
        default: "preview"
        type: choice
        options:
          - preview
          - production
      confirmation:
        description: "Type 'APPLY' to confirm migration execution"
        required: true

jobs:
  migrate:
    name: Execute Gated Migrations
    runs-on: ubuntu-latest
    environment: ${{ github.event.inputs.environment }}

    steps:
      - name: Assert confirmation
        run: |
          if [ "${{ github.event.inputs.confirmation }}" != "APPLY" ]; then
            echo "Migration aborted: Confirmation was not 'APPLY'"
            exit 1
          fi

      - name: Check out repository
        uses: actions/checkout@v4

      - name: Setup Node.js 22
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: "npm"

      - name: Install dependencies
        run: npm ci

      - name: Run database migrations
        run: npm run db:migrate
        env:
          DATABASE_DIRECT_URL: ${{ secrets.DATABASE_DIRECT_URL }}
          DATABASE_URL: ${{ secrets.DATABASE_URL }}

